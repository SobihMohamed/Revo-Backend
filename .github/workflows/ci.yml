name: Revo CI/CD Pipeline

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]

# إضافة الصلاحيات دي مهمة جداً عشان مكتبة dorny/test-reporter تقدر تكتب التقرير في الـ PR
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 📦 Restore Dependencies
        run: dotnet restore Revo.slnx

      - name: 🔨 Build the Solution
        run: dotnet build Revo.slnx --no-restore --configuration Release

      - name: 🧪 Run Architecture & Unit Tests
        # ملاحظة: شيلنا /p:Threshold=80 مؤقتاً عشان مفيش Test Cases اتكتبت لسه والبايبلاين ميضربش
        run: dotnet test Revo.slnx --no-build --configuration Release --verbosity normal --logger trx --results-directory "TestResults" /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

      - name: 📊 Publish Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: .NET Tests Report
          path: TestResults/*.trx
          reporter: dotnet-trx
